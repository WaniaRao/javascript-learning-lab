

<!DOCTYPE html>
<html>
<head>
    <title>Delete Table Row</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: lightblue;
        }

        button {
            background-color: red;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Student Record</h2>

    <table id="myTable">
        <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>Wania</td>
            <td>12</td>
            <td><button onclick="deleteRow(event)">Delete</button></td>
        </tr>

        <tr>
            <td>Ahil</td>
            <td>11</td>
            <td><button onclick="deleteRow(event)">Delete</button></td>
        </tr>

        <tr>
            <td>Namal</td>
            <td>12</td>
            <td><button onclick="deleteRow(event)">Delete</button></td>
        </tr>

        <tr>
            <td>Zeehan</td>
            <td>10</td>
            <td><button onclick="deleteRow(event)">Delete</button></td>
        </tr>
    </table>

    <script>
        function deleteRow(e) {
            console.log("Delete button clicked");

            const row = e.target.closest("tr");

            row.remove();
        }
    </script>

</body>
</html>
