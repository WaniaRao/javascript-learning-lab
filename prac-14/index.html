
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Events Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>JavaScript Events Practice</h1>

    <!-- Question 1: Signup Form -->
    <h2>1. Signup Form</h2>

    <form id="signupForm">
        <input type="text" id="name" placeholder="Enter Name" required>
        <input type="email" id="email" placeholder="Enter Email" required>
        <input type="password" id="password" placeholder="Enter Password" required>
        <button type="submit">Submit</button>
    </form>

    <div id="signupResult"></div>

    <hr>

    <!-- Question 2: Read More -->
    <h2>2. Read More</h2>

    <p>
        JavaScript is a programming language.
        <span id="moreText" style="display:none;">
            It is used to make web pages interactive.
        </span>
    </p>

    <button id="readBtn">Read More</button>

    <hr>

    <!-- Question 3: Student Form -->
    <h2>3. Student Form</h2>

    <form id="studentForm">
        <input type="text" id="studentName" placeholder="Student Name" required>
        <input type="text" id="studentClass" placeholder="Class" required>
        <input type="text" id="studentRoll" placeholder="Roll Number" required>
        <button type="submit">Add Student</button>
    </form>

    <h3>Student Records</h3>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Class</th>
                <th>Roll No</th>
                <th>Delete</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <!-- Hidden Edit Form -->
    <form id="editForm" style="display:none;">
        <h3>Edit Student</h3>
        <input type="text" id="editName" required>
        <input type="text" id="editClass" required>
        <input type="text" id="editRoll" required>
        <button type="submit">Update Student</button>
        <button type="button" id="cancelEdit">Cancel</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
