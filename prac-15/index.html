
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Practice Set 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>JavaScript Practice Set 3</h1>

    <h2>Q1. Marks Checker</h2>
    <input type="number" id="marks" placeholder="Enter Marks">
    <button onclick="checkMarks()">Check</button>
    <p id="marksResult"></p>

    <hr>

    <h2>Q2. Multiplication Table</h2>
    <input type="number" id="tableNum" placeholder="Enter Number">
    <button onclick="makeTable()">Show Table</button>
    <p id="tableResult"></p>

    <hr>

    <h2>Q3. Character Counter</h2>
    <input type="text" id="sentence" placeholder="Write Something">
    <button onclick="countCharacters()">Count</button>
    <p id="charResult"></p>

    <hr>

    <h2>Q4. Background Changer</h2>
    <button onclick="changeBackground('pink')">Pink</button>
    <button onclick="changeBackground('lightblue')">Blue</button>
    <button onclick="changeBackground('lightgreen')">Green</button>

    <hr>

    <h2>Q5. Simple Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="userPassword" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginResult"></p>

    <script src="script.js"></script>
</body>
</html>
