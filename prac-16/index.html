
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice Set 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>JavaScript Practice</h1>
    <p class="subtitle">Practice Set 04</p>

    <div class="container">

        <!-- Question 1 -->
        <div class="box">
            <h2>1. Vowel Checker</h2>
            <input type="text" id="alphabet" placeholder="Enter an alphabet">
            <button onclick="checkVowel()">Check</button>
            <p id="vowelResult"></p>
        </div>

        <!-- Question 2 -->
        <div class="box">
            <h2>2. Even Numbers</h2>
            <button onclick="showEven()">Show Even Numbers</button>
            <p id="evenResult"></p>
        </div>

        <!-- Question 3 -->
        <div class="box">
            <h2>3. Largest Number</h2>
            <input type="number" id="num1" placeholder="First number">
            <input type="number" id="num2" placeholder="Second number">
            <input type="number" id="num3" placeholder="Third number">
            <button onclick="findLargest()">Find Largest</button>
            <p id="largestResult"></p>
        </div>

        <!-- Question 4 -->
        <div class="box">
            <h2>4. Password Length</h2>
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="checkPassword()">Check Password</button>
            <p id="passwordResult"></p>
        </div>

        <!-- Question 5 -->
        <div class="box">
            <h2>5. Shopping Discount</h2>
            <input type="number" id="amount" placeholder="Enter shopping amount">
            <button onclick="calculateDiscount()">Calculate</button>
            <p id="discountResult"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
